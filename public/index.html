<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Library</title>
    <link href="style/style.css" rel="stylesheet" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <script src="js/main.js" type="module" defer></script>
    <script src="keymap/keymap.js" defer></script>
  </head>
  <body>
    <div id="fallback-ui" style="display:none"></div>
    <div class="header">
      <div></div>
      <nav class="header-right" id="navLinks"></nav>
      <input
        type="text"
        id="searchInput"
        placeholder="Quick search ( / )"
        class="search-bar"
        title="Click to search..."
      />
      <input type="checkbox" class="keyboard-nav" title="Keyboard Navigation" style="height:0;width:0;cursor:pointer;"></input>
    </div>
    <div class="container" id="fileContainer"></div>
    <div id="toast-container"></div>
    <div class="feature">
      <a href="old-library.html" class="feature-all param-link">Cache</a>
    </div>
    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      <h4>Loading your movies...</h4>
    </div>
    <script>
    // Fallback UI for direct file access
    function showFallbackUI() {
      const fallback = document.getElementById('fallback-ui');
      fallback.style.display = 'flex';
      fallback.innerHTML = `
<div style="
  background: rgba(20,20,20,0.97);
  color: #fff;
  border-radius: 18px;
  padding: 48px 36px;
  max-width: 520px;
  margin: 80px auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  text-align: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  ">
  <img src="assets/favicon.png" alt="Local Library" style="width:96px;border-radius:18px;box-shadow:0 2px 8px #0003;">
  <h2 style="color:#ffc107;">Local Library Not Running</h2>
  <p style="font-size:1.1rem;color:#eee;">
    It looks like you opened <b>index.html</b> directly.<br>
    <span style="color:#ffb300;">This app requires a local server to function.</span>
  </p>
  <ol style="text-align:left;max-width:420px;margin:0 auto 0 0;color:#ccc;font-size:1rem;">
    <li>Install <b>Node.js</b> (if not already installed).</li>
    <li>Open a terminal in this folder.</li>
    <li>Run <code style="background:#222;padding:2px 6px;border-radius:4px;">npm install</code></li>
    <li>Start the server with <code style="background:#222;padding:2px 6px;border-radius:4px;">node server.js</code></li>
    <li>Update <b>setting.js files</b> in your editor.</li>
  </ol>
  <p style="color:#aaa;font-size:0.95rem;">
    For more help, see the <a href="https://github.com/wormcracker/local-library#installation" target="_blank" style="color:#17a2b8;text-decoration:underline;">installation guide</a>.
  </p>
</div>
`;
      // Hide the rest of the app
      document.querySelectorAll('body > *:not(#fallback-ui)').forEach(el => el.style.display = 'none');
    }

  // Detect file:// protocol or missing server
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', showFallbackUI);
  }
</script>
  </body>
</html>
